{% include base_path %}

<li class="cv-pub">
  <a href="{{ base_path }}{{ post.url }}">{{ post.title }}</a>
  {% if post.award %}<span class="badge badge--award">{{ post.award }}</span>{% endif %}
  {% if post.status %}<span class="badge badge--status">{{ post.status }}</span>{% endif %}
  {% if post.venue %}<span class="cv-pub-venue">{{ post.venue }}, {{ post.date | default: "1900-01-01" | date: "%Y" }}</span>{% endif %}
</li>
